version: '3.9'

services:
  app:
    build: .
    container_name: chapter4-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coffee
      SPRING_DATASOURCE_USERNAME: coffee_user
      SPRING_DATASOURCE_PASSWORD: coffee_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - ./config/application.yml:/app/application.yml
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chapter4-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: chapter4-db
    ports:
      - "5432:5432"  # Проброс порта для доступа с хоста
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_pass
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chapter4-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_user -d coffee"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chapter4-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - chapter4-network
    restart: unless-stopped

networks:
  chapter4-network:
    driver: bridge

volumes:
  pgdata:
